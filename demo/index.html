<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phase 1 — Virtual DOM + Diff + Patch Demo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          'Pretendard',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #0f0f0f;
        color: #e0e0e0;
        min-height: 100vh;
        padding: 24px;
      }

      h1 {
        text-align: center;
        margin-bottom: 8px;
        font-size: 1.6rem;
        color: #fff;
      }

      .subtitle {
        text-align: center;
        color: #888;
        margin-bottom: 24px;
        font-size: 0.9rem;
      }

      /* ── 버튼 바 ── */
      .toolbar {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }

      .toolbar button {
        padding: 10px 24px;
        border: 1px solid #444;
        border-radius: 8px;
        background: #1a1a1a;
        color: #e0e0e0;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.15s;
      }

      .toolbar button:hover:not(:disabled) {
        background: #2a2a2a;
        border-color: #666;
      }

      .toolbar button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .toolbar button.primary {
        background: #1d4ed8;
        border-color: #3b82f6;
        color: #fff;
        font-weight: 600;
      }

      .toolbar button.primary:hover:not(:disabled) {
        background: #2563eb;
      }

      /* ── 패널 레이아웃 ── */
      .panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 24px;
      }

      .panel {
        border: 1px solid #333;
        border-radius: 12px;
        overflow: hidden;
        background: #141414;
      }

      .panel-header {
        background: #1a1a1a;
        padding: 12px 16px;
        border-bottom: 1px solid #333;
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #999;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .panel-header .badge {
        background: #333;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.75rem;
        color: #aaa;
      }

      .panel-body {
        padding: 16px;
        min-height: 120px;
      }

      .panel-body.rendered {
        /* 실제/테스트 영역 렌더 결과 */
      }

      .panel-body.rendered * {
        color: #e0e0e0;
      }

      /* ── 테스트 영역 편집기 (contenteditable) ── */
      #test-area {
        min-height: 100px;
      }

      /* ── Diff 결과 패널 ── */
      .diff-panel {
        border: 1px solid #333;
        border-radius: 12px;
        overflow: hidden;
        background: #141414;
        margin-bottom: 24px;
      }

      .diff-panel .panel-header {
        background: #1a1a1a;
      }

      .diff-log {
        padding: 16px;
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 0.82rem;
        line-height: 1.6;
        max-height: 300px;
        overflow-y: auto;
        color: #999;
        white-space: pre-wrap;
      }

      .diff-log .patch-item {
        padding: 4px 8px;
        border-radius: 4px;
        margin-bottom: 4px;
      }

      .diff-log .INSERT {
        background: rgba(34, 197, 94, 0.12);
        color: #4ade80;
      }

      .diff-log .REMOVE {
        background: rgba(239, 68, 68, 0.12);
        color: #f87171;
      }

      .diff-log .REPLACE {
        background: rgba(251, 191, 36, 0.12);
        color: #fbbf24;
      }

      .diff-log .SET_DATA {
        background: rgba(96, 165, 250, 0.12);
        color: #60a5fa;
      }

      .diff-log .UPDATE_ATTRS {
        background: rgba(168, 85, 247, 0.12);
        color: #c084fc;
      }

      /* ── State History 표시 ── */
      .history-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 24px;
        color: #888;
        font-size: 0.85rem;
      }

      .history-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #333;
        transition: all 0.2s;
      }

      .history-dot.active {
        background: #3b82f6;
        box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
      }

      .history-dot.visited {
        background: #555;
      }

      /* ── VNode 트리 뷰어 ── */
      .vdom-viewer {
        border: 1px solid #333;
        border-radius: 12px;
        overflow: hidden;
        background: #141414;
      }

      .vdom-viewer .panel-header {
        background: #1a1a1a;
        padding: 12px 16px;
        border-bottom: 1px solid #333;
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #999;
      }

      .vdom-json {
        padding: 16px;
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 0.78rem;
        line-height: 1.5;
        max-height: 400px;
        overflow-y: auto;
        color: #888;
        white-space: pre-wrap;
      }

      @media (max-width: 768px) {
        .panels {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <h1>🔬 Virtual DOM — Diff & Patch Demo</h1>
    <p class="subtitle">
      실제 영역의 DOM을 Virtual DOM으로 변환하고, 테스트 영역을 수정한 뒤 Patch를 눌러 차이만
      반영합니다.
    </p>

    <!-- 버튼 바 -->
    <div class="toolbar">
      <button id="btn-undo" disabled>⬅ 뒤로가기</button>
      <button id="btn-patch" class="primary">⚡ Patch</button>
      <button id="btn-redo" disabled>앞으로가기 ➡</button>
      <button id="btn-reset">🔄 초기화</button>
    </div>

    <!-- State History 도트 표시 -->
    <div class="history-bar">
      <span>State History:</span>
      <div id="history-dots" style="display: flex; gap: 6px; align-items: center"></div>
      <span id="history-label"></span>
    </div>

    <!-- 실제 영역 / 테스트 영역 -->
    <div class="panels">
      <div class="panel">
        <div class="panel-header">
          실제 영역 <span class="badge">읽기 전용 — Patch 결과가 여기 반영됩니다</span>
        </div>
        <div class="panel-body rendered" id="real-area"></div>
      </div>
      <div class="panel">
        <div class="panel-header">
          테스트 영역 <span class="badge">자유롭게 편집하세요 (contentEditable)</span>
        </div>
        <div class="panel-body rendered" id="test-area" contenteditable="true"></div>
      </div>
    </div>

    <!-- Diff 결과 로그 -->
    <div class="diff-panel">
      <div class="panel-header">📋 Diff 결과 (Patches)</div>
      <div class="diff-log" id="diff-log">Patch 버튼을 누르면 여기에 변경 내역이 표시됩니다.</div>
    </div>

    <!-- VNode 트리 뷰어 -->
    <div class="vdom-viewer">
      <div class="panel-header">🌳 현재 Virtual DOM (실제 영역 기준)</div>
      <div class="vdom-json" id="vdom-json">로딩 중...</div>
    </div>

    <script type="module">
      import { domToVNode, diff, applyPatches } from '../src/index.js';

      // ── 샘플 HTML ──
      const SAMPLE_HTML = `<div id="app" class="container">
  <h1>Hello, Virtual DOM!</h1>
  <p class="description">이 영역을 자유롭게 수정해보세요.</p>
  <ul>
    <li>항목 A</li>
    <li>항목 B</li>
    <li>항목 C</li>
  </ul>
</div>`;

      // ── DOM 참조 ──
      const realArea = document.getElementById('real-area');
      const testArea = document.getElementById('test-area');
      const diffLog = document.getElementById('diff-log');
      const vdomJson = document.getElementById('vdom-json');
      const historyDots = document.getElementById('history-dots');
      const historyLabel = document.getElementById('history-label');
      const btnPatch = document.getElementById('btn-patch');
      const btnUndo = document.getElementById('btn-undo');
      const btnRedo = document.getElementById('btn-redo');
      const btnReset = document.getElementById('btn-reset');

      // ── State History ──
      // history[i] = VNode 스냅샷 (불변 객체)
      let history = [];
      let historyIndex = -1;

      // ── VNode → DOM 렌더 헬퍼 ──
      function renderVNodeToDOM(vnode) {
        if (vnode.type === 'text') return document.createTextNode(vnode.text);
        if (vnode.type === 'comment') return document.createComment(vnode.text);
        const el = document.createElement(vnode.tag);
        for (const [k, v] of Object.entries(vnode.attrs)) el.setAttribute(k, v);
        for (const child of vnode.children) el.appendChild(renderVNodeToDOM(child));
        return el;
      }

      // ── 영역 렌더링 ──
      function renderToArea(area, vnode) {
        area.innerHTML = '';
        area.appendChild(renderVNodeToDOM(vnode));
      }

      // ── VNode JSON 표시 ──
      function displayVNode(vnode) {
        vdomJson.textContent = JSON.stringify(vnode, null, 2);
      }

      // ── History 도트 업데이트 ──
      function updateHistoryUI() {
        historyDots.innerHTML = '';
        history.forEach((_, i) => {
          const dot = document.createElement('div');
          dot.className = 'history-dot';
          if (i === historyIndex) dot.classList.add('active');
          else if (i < historyIndex) dot.classList.add('visited');
          dot.title = `State #${i}`;
          dot.style.cursor = 'pointer';
          dot.addEventListener('click', () => navigateTo(i));
          historyDots.appendChild(dot);
        });
        historyLabel.textContent = `${historyIndex + 1} / ${history.length}`;
        btnUndo.disabled = historyIndex <= 0;
        btnRedo.disabled = historyIndex >= history.length - 1;
      }

      // ── 특정 History 인덱스로 이동 ──
      function navigateTo(index) {
        historyIndex = index;
        const vnode = history[historyIndex];
        renderToArea(realArea, vnode);
        renderToArea(testArea, vnode);
        displayVNode(vnode);
        updateHistoryUI();
        diffLog.innerHTML = `<span style="color:#666;">State #${index}로 이동했습니다.</span>`;
      }

      // ── Patch 결과를 예쁘게 표시 ──
      function displayPatches(patches) {
        if (patches.length === 0) {
          diffLog.innerHTML =
            '<span style="color:#666;">변경 사항이 없습니다. (동일한 트리)</span>';
          return;
        }
        diffLog.innerHTML = patches
          .map((p, i) => {
            const detail = formatPatch(p);
            return `<div class="patch-item ${p.type}">#${i + 1} [${p.type}] ${detail}</div>`;
          })
          .join('');
      }

      function formatPatch(p) {
        switch (p.type) {
          case 'INSERT':
            return `parentPath=[${p.parentPath}] index=${p.index} node=${summarizeVNode(p.node)}`;
          case 'REMOVE':
            return `path=[${p.path}]`;
          case 'REPLACE':
            return `path=[${p.path}] → ${summarizeVNode(p.node)}`;
          case 'SET_DATA':
            return `path=[${p.path}] value="${p.value}"`;
          case 'UPDATE_ATTRS':
            const sets = Object.entries(p.set)
              .map(([k, v]) => `${k}="${v}"`)
              .join(', ');
            const rems = p.remove.join(', ');
            return `path=[${p.path}]${sets ? ' set: ' + sets : ''}${rems ? ' remove: ' + rems : ''}`;
          default:
            return JSON.stringify(p);
        }
      }

      function summarizeVNode(v) {
        if (v.type === 'text')
          return `text("${v.text.length > 30 ? v.text.slice(0, 30) + '…' : v.text}")`;
        if (v.type === 'comment') return `<!--${v.text}-->`;
        return `<${v.tag}> (${v.children.length} children)`;
      }

      // ── 초기화 ──
      function init() {
        // 1. 실제 영역에 샘플 HTML 넣기
        realArea.innerHTML = SAMPLE_HTML;

        // 2. 실제 영역의 DOM을 Virtual DOM으로 변환
        const initialVNode = domToVNode(realArea.childNodes[0]);

        // 3. History 초기화
        history = [initialVNode];
        historyIndex = 0;

        // 4. Virtual DOM으로 테스트 영역 렌더링
        renderToArea(testArea, initialVNode);

        // 5. VNode 표시
        displayVNode(initialVNode);
        updateHistoryUI();
        diffLog.innerHTML =
          '<span style="color:#666;">초기 Virtual DOM을 생성했습니다. 테스트 영역을 수정한 뒤 Patch 버튼을 눌러보세요.</span>';
      }

      // ── Patch 버튼 ──
      btnPatch.addEventListener('click', () => {
        // 1. 현재 테스트 영역을 다시 Virtual DOM으로 변환
        if (!testArea.childNodes[0]) {
          diffLog.innerHTML = '<span style="color:#f87171;">테스트 영역이 비어있습니다.</span>';
          return;
        }
        const newVNode = domToVNode(testArea.childNodes[0]);

        // 2. 이전 VNode와 diff
        const oldVNode = history[historyIndex];
        const patches = diff(oldVNode, newVNode);

        // 3. 변경된 부분만 실제 영역에 patch 적용
        applyPatches(realArea, patches);

        // 4. Diff 결과 표시
        displayPatches(patches);

        // 5. History에 새 VNode 저장 (현재 위치 이후의 히스토리는 잘라냄 — 브라우저 히스토리와 동일)
        history = history.slice(0, historyIndex + 1);
        history.push(newVNode);
        historyIndex = history.length - 1;

        // 6. UI 업데이트
        displayVNode(newVNode);
        updateHistoryUI();
      });

      // ── 뒤로가기 ──
      btnUndo.addEventListener('click', () => {
        if (historyIndex > 0) navigateTo(historyIndex - 1);
      });

      // ── 앞으로가기 ──
      btnRedo.addEventListener('click', () => {
        if (historyIndex < history.length - 1) navigateTo(historyIndex + 1);
      });

      // ── 초기화 버튼 ──
      btnReset.addEventListener('click', init);

      // ── 시작 ──
      init();
    </script>
  </body>
</html>
